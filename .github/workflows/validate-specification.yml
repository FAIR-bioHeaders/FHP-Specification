name: Validate specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Install JSON-LD test dependencies
        run: python -m pip install -r requirements-jsonld.txt
      - name: Test validation checks
        run: python -m unittest discover -s tests -v
      - name: Validate schema and examples
        run: python scripts/validate_examples.py
      - name: Validate the FHP schema and examples
        run: python scripts/validate_examples.py --schema fhp.json --examples examples/fhp
      - name: Validate the FHGFF3 schema and examples
        run: python scripts/validate_examples.py --schema fhgff3.json --examples examples/fhgff3

      - name: Check LinkML validation equivalence
        run: python scripts/check_linkml.py
      - name: Check the generated JSON-LD context and vocabulary
        run: python scripts/make_jsonld.py --check

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check conformance vectors with the standard library only
        run: python scripts/check_conformance.py
      - name: Install the released toolkit
        # fair-bioheaders 0.9.0 (PyPI, 2026-11-04) is the first release that
        # bundles the shared v0.5.0 contracts (FHR 2.1, FHP 1.1, FHGFF3 1.1; its
        # bundled schema copies are byte-identical to the shared v0.5.0 release
        # commit). This replaces the legacy fhr==0.3.3 pin (FHP-Specification#3,
        # proposal Q1): 0.3.3 predates FHP entirely. The extra is [jsonld]
        # because 0.9.0 defines no [all] extra; [jsonld] is its only optional
        # dependency set. One reversible line: bump or revert here.
        run: |
          python -m venv "$RUNNER_TEMP/fair-bioheaders"
          "$RUNNER_TEMP/fair-bioheaders/bin/python" -m pip install "fair-bioheaders[jsonld]==0.9.0"
      - name: Run the released toolkit on the FHP, FHR and microdata vectors
        # fhp-fasta is no longer skipped (0.9.0 supports FHP). jsonld and fhgff3
        # stay skipped: this tree's vector copies for those formats are the
        # pre-v0.5.0 family state whose synchronization is gated by the
        # Q2 decision in docs/DEVELOPMENT-TREE-PROPOSAL.md (provenance.json
        # "deferred"); the 0.9.0 schema-selection rules reject their legacy
        # numeric schemaVersion/legacy-context bytes. The v0.5.0-era jsonld and
        # fhgff3 vectors, and every extension-field (R15) vector, are run
        # against this same toolkit release in shared-parity.yml on the pinned
        # upstream checkout.
        run: python scripts/check_conformance.py --skip-regeneration --skip-format jsonld --skip-format fhgff3 --require-format fhp-fasta --converter "$RUNNER_TEMP/fair-bioheaders"
