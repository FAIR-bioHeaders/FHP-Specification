name: Validate specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Install JSON-LD test dependencies
        run: python -m pip install -r requirements-jsonld.txt
      - name: Test validation checks
        run: python -m unittest discover -s tests -v
      # The Q2 decision (FHP-Specification#2, 2026-11-12): FHP CI generates and
      # validates the FHP chain only. The inherited FHR/FHGFF3 contracts, models
      # and their generated outputs are pinned compatibility fixtures
      # (provenance.json "pinned"); the shared-parity workflow verifies their
      # bytes, and the unit suite above keeps testing them as frozen fixtures.
      - name: Validate the FHP schema and examples
        run: python scripts/validate_examples.py --schema fhp.json --examples examples/fhp
      - name: Check LinkML validation equivalence (FHP)
        run: python scripts/check_linkml.py
      - name: Check the generated FHP JSON-LD context and vocabulary
        run: python scripts/make_jsonld.py --check --fhp

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check conformance vectors with the standard library only
        run: python scripts/check_conformance.py
      - name: Install the released toolkit
        # fair-bioheaders 0.12.0 (PyPI) bundles the shared v0.6.0 contracts
        # (FHR 2.1, FHP 1.2, FHGFF3 1.2): its fhp-1.2.json is byte-identical to
        # this tree's fhp.json and to fhp.json at the v0.6.0 release commit
        # 0ae18b00. 0.9.0, the previous pin, predates v0.6.0 and answers
        # unsupported-version for every FHP 1.2 record. The extra is
        # [jsonld], the toolkit's optional dependency set this CI needs.
        # One reversible line: bump or revert here and in shared-parity.yml.
        run: |
          python -m venv "$RUNNER_TEMP/fair-bioheaders"
          "$RUNNER_TEMP/fair-bioheaders/bin/python" -m pip install "fair-bioheaders[jsonld]==0.12.0"
      - name: Run the released toolkit on the FHP-owned vectors
        # The FHP-owned manifest (Q4, FHP-Specification#2) covers the complete
        # fhp-fasta vector set — every vector of the pinned v0.6.0 release,
        # including the five fhp-fasta-busco-lineage-* vectors it added, and
        # this repository's fhp-fasta-author-bad-name-type — plus the shared
        # FASTA-container vectors that exercise the R rules on the same FASTA
        # header reader. fhp-fasta is required. The complete family manifest
        # (gfa, microdata, jsonld and fhgff3 vectors) runs against this same
        # toolkit release in shared-parity.yml on the pinned upstream checkout.
        run: python scripts/check_conformance.py --skip-regeneration --require-format fhp-fasta --converter "$RUNNER_TEMP/fair-bioheaders"
      - name: Validate the real-data FHP example with the released toolkit
        # examples/fhp/dmel-chr4 cites FHP 1.2 (v0.6.0); the released reader
        # must accept its header and checksum, not only this tree's jsonschema.
        run: |
          "$RUNNER_TEMP/fair-bioheaders/bin/fhr-fasta-validate" examples/fhp/dmel-chr4/chr4.fhp.fasta
          "$RUNNER_TEMP/fair-bioheaders/bin/fhr-fasta-validate" examples/fhp/dmel-chr4/chr4.fhr.fasta
