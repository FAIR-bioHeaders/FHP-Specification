name: Publish JSON-LD on Pages

# Builds the GitHub Pages site with scripts/build_pages.py: the vocabulary under
# terms/ and the JSON-LD files of main and of every release tag under fhr/.
# Pages serves them with JSON-LD and Turtle media types and CORS, and the
# w3id.org/fair-bioheaders redirects point here. Tags are fetched so release
# copies are rebuilt on every run.
#
# The preflight job checks whether GitHub Pages is enabled for this repository
# (FAIR-bioHeaders/FHP-Specification#10). Without a Pages site the remaining
# jobs cannot configure or deploy Pages, so they are skipped and reported as
# skipped instead of failing every push to main. When Pages is enabled, the
# build and deployment are unchanged.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Pages availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading the Pages site also uses the documented Pages scope. If
      # GITHUB_TOKEN cannot read Pages metadata, GitHub answers 403 instead of
      # 404; both are treated as "not enabled" below, so a repository without
      # Pages still has green pushes and a notice explains the skip.
      pages: write
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # gh api prints the HTTP status line with --include even on an error
          # response (and exits non-zero), so only the first line is inspected.
          status=$(gh api "repos/$GH_REPO/pages" --include 2>/dev/null \
            | head -n 1 | awk '{print $2}' || true)
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is enabled for $GH_REPO; building and deploying the JSON-LD site."
              ;;
            403|404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::GitHub Pages is not enabled for $GH_REPO (HTTP $status); skipping the JSON-LD build and deployment. Enable Pages with the \"GitHub Actions\" source to publish it."
              ;;
            *)
              echo "::error::Could not determine whether GitHub Pages is enabled for $GH_REPO (HTTP ${status:-no response})."
              exit 1
              ;;
          esac

  build:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build the site
        run: python scripts/build_pages.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: [preflight, build]
    if: needs.preflight.outputs.enabled == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
