voucherSpecimen: >-
  BioSample SAMN02803731 (uid 2803731), sample name and title "iso-1", owner
  Lawrence Berkeley National Laboratory, submitted 2014-05-29 and live since
  2014-07-23, linked to BioProject PRJNA13812: strain iso-1, tissue whole
  embryo, dev_stage embryos, sex mixed, biomaterial provider "Roger Hoskins and
  Gerry Rubin"; its comment describes it as the isogenic strain used for
  sequencing of the reference genome by BDGP and Celera Genomics as described in
  Adams et al 2000 (PubMed 10731132). The GenBank source feature of NC_004353.4
  gives the stock genotype y[1]; Gr22b[1] Gr22d[1] cn[1] CG33964[R4.2] bw[1]
  sp[1]; LysC[1] MstProx[1] GstD5[1] Rh6[1], identical to the BioSample genotype
  attribute. No physical voucher accession is stated by either record.
