documentation: >-
  Pilot and teaching artifact, not a production reference. One sequence record:
  chromosome 4, RefSeq NC_004353.4 (GenBank AE014135.4), 1348131 bases, taken
  verbatim as defline plus sequence lines from
  GCF_000001215.4_Release_6_plus_ISO1_MT_genomic.fna.gz (SHA-256
  e69e907b5e87ce756236dcef93e82001cfd08f1a0ed5f22e36cbbd3a87ebc57d),
  downloaded 2026-11-15. A real deployment links an FHP header to the
  whole-assembly FHR, not to a single-chromosome subset. Masking is soft-masked
  as measured on these bytes: 374633 of 1331131 ACGT characters are lowercase
  (28.14 percent), and the only N characters are 17000 uppercase N, which
  equals the one spanned gap NCBI reports for chromosome 4
  (assembly_stats total-length 1348131 minus ungapped-length 1331131). The
  masking agent is not documented in the delivery, so repeat-masked is not
  claimed. version is the version suffix shared by GCF_000001215.4 and
  NC_004353.4; dateCreated is the assembly report Date field (2014-08-01) and
  the subset itself was extracted on 2026-11-15. vitalStats and seqcol_id are
  absent: the published assembly statistics describe the whole assembly, not
  this subset, and no GA4GH sequence collection digest was supplied. See
  README.md in this directory for the probes, digests and commands.
