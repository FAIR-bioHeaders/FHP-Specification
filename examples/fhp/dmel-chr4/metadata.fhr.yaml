# FHR header input for the chromosome 4 subset of Drosophila melanogaster
# GCF_000001215.4 ("Release 6 plus ISO1 MT").
#
# Pilot and teaching artifact for FAIR-bioHeaders/FHP-Specification#29, not a
# production reference: the file carries one sequence record (NC_004353.4), so
# the checksum describes a single-chromosome subset of the assembly rather than
# the assembly. A production FHP parent points at the whole-assembly FHR.
#
# Every value below is traceable to a probe recorded in README.md in this
# directory. The sequence bytes are the NCBI delivery and are not relicensed
# here; this header is an MPL-2.0 FAIR-bioHeaders contribution (March 2025
# onward). Written for the released fair-bioheaders 0.11.0 toolkit
# (`bioheaders combine`); the checksum is computed by the tool, never written
# by hand.
