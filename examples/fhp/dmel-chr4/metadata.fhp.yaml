# FHP header input for the chromosome 4 protein subset of Drosophila
# melanogaster GCF_000001215.4 ("Release 6 plus ISO1 MT").
#
# Pilot and teaching artifact for FAIR-bioHeaders/FHP-Specification#29, not a
# production reference: the protein set is the subset that the RefSeq annotation
# places on one molecule (NC_004353.4), and its parent is the single-chromosome
# FHR shipped beside it in this directory, not the whole assembly.
#
# Every value below is traceable to a probe recorded in README.md in this
# directory. The sequence bytes are the NCBI delivery and are not relicensed
# here; this header is an MPL-2.0 FAIR-bioHeaders contribution (March 2025
# onward). Written for the released fair-bioheaders 0.11.0 toolkit
# (`bioheaders combine`); the checksum is computed by the tool, never written by
# hand, and the derivedFrom checksum below is the value the toolkit itself
# reported for chr4.fhr.fasta (`bioheaders verify` and `bioheaders convert`
# output quoted in README.md).
