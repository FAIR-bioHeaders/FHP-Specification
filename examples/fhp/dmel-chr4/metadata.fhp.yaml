    assemblyAccession: GCF_000001215.4
    sequenceCount: 298
    description: >-
      The 298 protein records whose accession appears as the protein_id of a CDS
      feature on NC_004353.4 in this delivery's genomic.gff, copied verbatim from
      GCF_000001215.4_Release_6_plus_ISO1_MT_protein.faa.gz (SHA-256
      4bf959b02c5b4c58accb36552e30bbf77f5088713b155ef4e02f4e6edc2d9dff). The GFF
      names its annotation source as FlyBase Release 6.54 and its genome build as
